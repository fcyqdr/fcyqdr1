    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('https://via.placeholder.com/1920x1080'); /* 默认背景图片 */

        body.light-mode {

        }
        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 72px;
            color: #FFD700;
            animation: wave 2s infinite;
            position: relative;
            display: inline-block;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            z-index: 10;
        }
        li {
            margin: 15px 0;
            opacity: 1; /* 移除淡入效果，直接显示 */
            animation: glow 2s infinite; /* 闪动发光动画 */
            animation-delay: calc(0.2s * var(--i)); /* 逐条延迟 */
        }
        a {
            text-decoration: none;
            color: #87CEEB;
            font-size: 24px;
            transition: color 0.3s;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            display: inline-block; /* 确保发光效果应用到整个链接 */
        }
        a:hover {
            color: #00cc00;
        }
        .door {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: #2F4F4F;
            z-index: 1000;
        }
        .door-left {
            left: 0;
            animation: openLeft 5s ease-out forwards;
        }
        .door-right {
            right: 0;
            animation: openRight 5s ease-out forwards;
        }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes glow {
            0% {
                box-shadow: 0 0 5px #87CEEB, 0 0 10px #87CEEB, 0 0 15px #00FFFF; /* 初始发光 */
                text-shadow: 0 0 5px #87CEEB, 0 0 10px #00FFFF;
            }
            50% {
                box-shadow: 0 0 10px #87CEEB, 0 0 20px #00FFFF, 0 0 30px #00FFFF; /* 增强发光 */
                text-shadow: 0 0 10px #87CEEB, 0 0 20px #00FFFF;
            }
            100% {
                box-shadow: 0 0 5px #87CEEB, 0 0 10px #87CEEB, 0 0 15px #00FFFF; /* 回到初始 */
                text-shadow: 0 0 5px #87CEEB, 0 0 10px #00FFFF;
            }
        }
        @keyframes openLeft {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        @keyframes openRight {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
    </style>
</head>

    <script>
        const backgrounds = [
            '背景6.jpg', // 默认占位图1
            '背景9.jpg', // 占位图2
            '背景4.jpg'  // 占位图3
            // 替换为你的实际图片URL
        ];
        let currentIndex = 0;

        // 检测系统主题并应用
        function setTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
            }
        }

        // 监听主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTheme);

        // 初始设置主题
        setTheme();

        function changeBackground() {
            document.body.style.backgroundImage = `url('${backgrounds[currentIndex]}')`;
            currentIndex = (currentIndex + 1) % backgrounds.length;
        }

        // 每5秒切换一次背景
        setInterval(changeBackground, 5000);

        // 页面加载时立即切换一次，确保动画生效
        changeBackground();
    </script>
</body>
